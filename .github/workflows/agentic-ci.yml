name: Agentic CI

on:
  push:
    branches: ["main", "master", "feat/*", "fix/*"]
  pull_request:
    branches: ["main", "master"]

jobs:
  verify:
    name: Verify (Lint, Typecheck, Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Tests
        run: npx vitest run
