name: Vercel Deployment Failure Monitor

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  monitor_failure_event:
    name: Alert on failed Vercel deployment
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment.creator.login == 'vercel[bot]' &&
      github.event.deployment_status.state == 'failure'
    steps:
      - name: Write summary
        run: |
          echo "## Vercel deployment failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: \`${{ github.repository }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch/Ref: \`${{ github.event.deployment.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.event.deployment.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: \`${{ github.event.deployment.environment }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment URL: ${{ github.event.deployment_status.target_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Logs URL: ${{ github.event.deployment_status.log_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Common causes (check Vercel build logs above)" >> "$GITHUB_STEP_SUMMARY"
          echo "1. **DATABASE_URL missing for Build** – Set in Vercel → Project Settings → Environment Variables for Build (Production + Preview). Required for \`prisma generate\` in postinstall." >> "$GITHUB_STEP_SUMMARY"
          echo "2. **package-lock.json out of sync** – Run \`npm install\` locally and commit the updated lockfile." >> "$GITHUB_STEP_SUMMARY"
          echo "3. **Node version** – Ensure Project Settings or \`vercel.json\` matches required Node (e.g. 20)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "See [docs/cursor-automation-vercel-failures.md](https://github.com/${{ github.repository }}/blob/main/docs/cursor-automation-vercel-failures.md) for full setup and automation." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the workflow to notify maintainers
        run: |
          echo "Vercel deployment failed for ${{ github.event.deployment.sha }}."
          exit 1
