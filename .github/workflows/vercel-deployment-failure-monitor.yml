name: Vercel Deployment Failure Monitor

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  monitor_failure_event:
    name: Alert on failed Vercel deployment
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment.creator.login == 'vercel[bot]' &&
      github.event.deployment_status.state == 'failure'
    steps:
      - name: Write summary
        run: |
          echo "## Vercel deployment failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: \`${{ github.repository }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch/Ref: \`${{ github.event.deployment.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.event.deployment.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: \`${{ github.event.deployment.environment }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment URL: ${{ github.event.deployment_status.target_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Logs URL: ${{ github.event.deployment_status.log_url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the workflow to notify maintainers
        run: |
          echo "Vercel deployment failed for ${{ github.event.deployment.sha }}."
          exit 1
