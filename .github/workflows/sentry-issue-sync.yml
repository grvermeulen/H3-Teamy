name: Sentry Issue Sync

on:
  schedule:
    - cron: "0 8 * * 1-5"
  workflow_dispatch:

jobs:
  sync:
    name: Sync Unresolved Sentry Issues to GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Fetch unresolved Sentry issues
        id: sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: h3-teamy
          SENTRY_PROJECT: javascript-nextjs
        run: |
          ISSUES=$(curl --fail-with-body --show-error --max-time 30 \
            -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
            "https://sentry.io/api/0/projects/$SENTRY_ORG/$SENTRY_PROJECT/issues/?query=is:unresolved+!has:github&statsPeriod=24h&limit=10")

          echo "issues<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ISSUES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub issues for new Sentry errors
        uses: actions/github-script@v7
        env:
          SENTRY_ISSUES: ${{ steps.sentry.outputs.issues }}
        with:
          script: |
            const raw = process.env.SENTRY_ISSUES ?? "[]";
            let parsed;
            try {
              parsed = JSON.parse(raw);
            } catch (e) {
              core.setFailed(`Invalid JSON from Sentry step: ${e}`);
              return;
            }
            if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
              if ("detail" in parsed || "message" in parsed) {
                core.setFailed(`Sentry API error: ${JSON.stringify(parsed)}`);
                return;
              }
              core.setFailed(
                "Unexpected Sentry API response (expected an array of issues).",
              );
              return;
            }
            if (!Array.isArray(parsed)) {
              core.setFailed(
                "Unexpected Sentry API response (expected an array of issues).",
              );
              return;
            }
            const issues = parsed;
            if (issues.length === 0) {
              core.info("No new unresolved Sentry issues");
              return;
            }

            for (const issue of issues.slice(0, 5)) {
              const title = `[Sentry] ${issue.title}`;
              const { data: existing } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                labels: "sentry",
                per_page: 100,
              });

              if (existing.some((i) => i.title === title)) {
                core.info(`Skipping duplicate: ${title}`);
                continue;
              }

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  `**Sentry Issue**: ${issue.permalink}`,
                  `**Level**: ${issue.level}`,
                  `**Events**: ${issue.count}`,
                  `**First seen**: ${issue.firstSeen}`,
                  `**Last seen**: ${issue.lastSeen}`,
                  "",
                  "```",
                  issue.culprit || "N/A",
                  "```",
                ].join("\n"),
                labels: ["sentry", "bug"],
              });
              core.info(`Created issue: ${title}`);
            }
